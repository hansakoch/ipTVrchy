# omarchy-tv — mpv keybindings for channel surfing
# Keys are forwarded to the app via socat → Unix socket

+ run "/bin/sh" "-c" "echo '{\"action\":\"next\"}' | socat - UNIX-CONNECT:/tmp/omarchy-tv-app.sock"
= run "/bin/sh" "-c" "echo '{\"action\":\"next\"}' | socat - UNIX-CONNECT:/tmp/omarchy-tv-app.sock"
KP_ADD run "/bin/sh" "-c" "echo '{\"action\":\"next\"}' | socat - UNIX-CONNECT:/tmp/omarchy-tv-app.sock"
- run "/bin/sh" "-c" "echo '{\"action\":\"prev\"}' | socat - UNIX-CONNECT:/tmp/omarchy-tv-app.sock"
_ run "/bin/sh" "-c" "echo '{\"action\":\"prev\"}' | socat - UNIX-CONNECT:/tmp/omarchy-tv-app.sock"
KP_SUBTRACT run "/bin/sh" "-c" "echo '{\"action\":\"prev\"}' | socat - UNIX-CONNECT:/tmp/omarchy-tv-app.sock"
ESC run "/bin/sh" "-c" "echo '{\"action\":\"quit\"}' | socat - UNIX-CONNECT:/tmp/omarchy-tv-app.sock" ; quit
