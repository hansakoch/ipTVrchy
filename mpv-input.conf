# Tvedge channel surfing — forward keys to app via IPC socket
+ run "/bin/sh" "-c" "echo '{\"action\":\"next\"}' | socat - UNIX-CONNECT:/tmp/tvedge-app.sock"
= run "/bin/sh" "-c" "echo '{\"action\":\"next\"}' | socat - UNIX-CONNECT:/tmp/tvedge-app.sock"
KP_ADD run "/bin/sh" "-c" "echo '{\"action\":\"next\"}' | socat - UNIX-CONNECT:/tmp/tvedge-app.sock"
- run "/bin/sh" "-c" "echo '{\"action\":\"prev\"}' | socat - UNIX-CONNECT:/tmp/tvedge-app.sock"
_ run "/bin/sh" "-c" "echo '{\"action\":\"prev\"}' | socat - UNIX-CONNECT:/tmp/tvedge-app.sock"
KP_SUBTRACT run "/bin/sh" "-c" "echo '{\"action\":\"prev\"}' | socat - UNIX-CONNECT:/tmp/tvedge-app.sock"
ESC run "/bin/sh" "-c" "echo '{\"action\":\"quit\"}' | socat - UNIX-CONNECT:/tmp/tvedge-app.sock" ; quit
